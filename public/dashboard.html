<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — LeadRush</title>
  <link rel="icon" href="/img/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <a href="/" class="logo"><img src="/img/logo.png" alt="LeadRush"></a>
      <a href="#overview" class="nav-item" data-view="overview">📊 Overview</a>
      <a href="#leads" class="nav-item" data-view="leads">⚡ Leads <span class="count" id="newCount" hidden></span></a>
      <a href="#agents" class="nav-item admin-only" data-view="agents" hidden>👥 Agents <span class="count" id="pendingCount" hidden></span></a>
      <a href="#campaigns" class="nav-item admin-only" data-view="campaigns" hidden>🎯 Campaigns</a>
      <a href="#settings" class="nav-item" data-view="settings">⚙️ Settings</a>
      <div class="spacer"></div>
      <div class="me"><b id="meName"></b><br><span class="muted" id="meRole"></span> · <button id="logout">Log out</button></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <h1 id="title">Overview</h1>
        <div class="right">
          <div class="avail" id="avail" role="switch" tabindex="0" title="When on, new leads and live calls are routed to you">
            <span class="dot"></span><span class="label-text" id="availText">Offline</span><span class="switch"></span>
          </div>
        </div>
      </header>
      <div class="view" id="view"></div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer"></aside>
  <div class="toasts" id="toasts"></div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
