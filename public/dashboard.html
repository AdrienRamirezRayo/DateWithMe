<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard — LeadRush</title>
  <link rel="icon" href="/img/icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <meta name="theme-color" content="#07070c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LeadRush">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <a href="/" class="logo"><img src="/img/logo.png" alt="LeadRush"></a>
      <nav id="nav"></nav>
      <div class="spacer"></div>
      <div class="me"><b id="meName"></b><br><span class="muted" id="meRole"></span> · <button id="logout">Log out</button></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <h1 id="title">Overview</h1>
        <div class="right">
          <a href="#wallet" class="balance" id="balance" title="Wallet balance"></a>
          <div class="avail" id="avail" role="switch" tabindex="0" title="When on, new leads and live calls are routed to you">
            <span class="dot"></span><span class="label-text" id="availText">Offline</span><span class="switch"></span>
          </div>
        </div>
      </header>
      <div class="view" id="view"></div>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer"></aside>
  <div class="toasts" id="toasts"></div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
